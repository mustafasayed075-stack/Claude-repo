name: Debug APK release

# Builds app-debug.apk, runs the unit tests, and publishes the APK as a
# GitHub Release asset so it can be downloaded directly from a browser.
on:
  push:
    branches:
      - claude/android-app-stages-1-2-5jw5hz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: Guardian debug build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Debug build of `${{ github.ref_name }}` at ${{ github.sha }}.
            Unit tests (testDebugUnitTest) passed before publishing.
          files: app/build/outputs/apk/debug/app-debug.apk
